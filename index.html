<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grifter: family gift exchanges, a little less painful</title>
  <meta name="description" content="Wish lists, who's getting what, and splitting the big gifts, all in one app for the family.">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    .hero { text-align: center; margin-top: 4rem; }
    /* iOS rounds icons at about 22% of their width. */
    .hero .app-icon { display: block; margin: 0 auto 1.5rem; border-radius: 22.5%; box-shadow: 0 4px 16px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08); }
    .hero .name { font-size: 1rem; font-weight: 600; letter-spacing: .02em; color: #6e6e73; margin: 0 0 .5rem; }
    .hero h1 { font-size: 2.25rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .75rem; }
    .hero .lede { font-size: 1.15rem; color: #424245; margin: 0 auto 2rem; max-width: 26rem; }
    /* Black on light, white on dark, like the App Store's own buttons. */
    .hero a.get { display: inline-block; background: #1d1d1f; color: #fff; padding: .8rem 1.5rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
    .hero a.get:hover { background: #000; }
    .hero .note { margin: .75rem 0 0; }
    footer { text-align: center; margin-top: 4rem; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      .hero .name { color: #a1a1a6; }
      .hero .lede { color: #d2d2d7; }
      .hero a.get { background: #f5f5f7; color: #1d1d1f; }
      .hero a.get:hover { background: #fff; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="app-icon" src="/app-icon-256.png" alt="Grifter app icon" width="112" height="112">
    <p class="name">Grifter</p>
    <h1>Family gift exchanges, a little less painful.</h1>
    <p class="lede">Wish lists, who's getting what, and splitting the big gifts, all in one app for the family.</p>
    <a class="get" href="/get">Get the Grifter iOS App</a>
    <p class="muted note">Free for iPhone. Now in beta on TestFlight.</p>
  </main>
  <footer class="muted"><a href="/support">Support</a> · <a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Use</a></footer>
</body>
</html>
